<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nearby</title>
  <meta name="description" content="Share files and text between devices on the same network. Peer-to-peer, nothing is uploaded.">
  <meta name="theme-color" content="#151634">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font stylesheet loads without blocking first paint; the system Thai font shows until it arrives. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const th = localStorage.getItem('nearby.theme'); if (th) document.documentElement.dataset.theme = th } catch {}
  </script>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-orb" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 9.5a13 13 0 0 1 18 0"/><path d="M6 13a8.5 8.5 0 0 1 12 0"/><path d="M9.2 16.4a4 4 0 0 1 5.6 0"/><circle cx="12" cy="19.4" r="1.1" fill="currentColor" stroke="none"/></svg>
      </span>
      <div>
        <h1>Nearby</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="actions">
      <button id="btn-install" class="icon-btn install" type="button" data-i18n-title="install" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span data-i18n="install"></span>
      </button>
      <button id="btn-room" class="chip" type="button">
        <span class="dot" id="mode-dot" aria-hidden="true"></span>
        <span id="mode-label"></span>
      </button>
      <button id="btn-notify" class="icon-btn notify" type="button" hidden></button>
      <button id="btn-lang" class="icon-btn text" type="button" data-i18n="language"></button>
      <button id="btn-theme" class="icon-btn" type="button" data-i18n-title="theme"></button>
    </div>
  </header>

  <main class="space" id="stage">
    <section class="hero">
      <p class="kicker" data-i18n="kicker"></p>
      <h2 id="hero-title"></h2>
      <p id="hero-sub"></p>
    </section>

    <div class="stage">
      <div class="radar" id="radar">
        <div class="radar-disc" aria-hidden="true">
          <span class="radar-rings"></span>
          <span class="radar-cross"></span>
          <span class="radar-sweep"></span>
        </div>
        <div class="radar-self" id="self">
          <span class="self-mascot" id="self-mascot" aria-hidden="true"></span>
          <span class="visually-hidden" id="self-label"></span>
        </div>
        <div class="radar-nodes" id="radar-nodes" role="group"></div>
      </div>

      <aside class="panel" id="panel">
        <div data-view="peer" hidden>
          <div class="panel-head">
            <p class="panel-kicker" data-i18n="panelKicker"></p>
            <button id="panel-close" class="icon-btn" type="button" data-i18n-title="deselect">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div class="panel-device">
            <span class="panel-mascot" id="panel-mascot" aria-hidden="true"></span>
            <div class="panel-id">
              <h3 id="panel-name"></h3>
              <p id="panel-sub"></p>
            </div>
          </div>
          <p class="panel-state" id="panel-state"><span class="state-dot" aria-hidden="true"></span><span id="panel-state-text"></span></p>
          <div class="verify">
            <span class="verify-label" data-i18n="verifyLabel"></span>
            <span class="verify-code" id="panel-code"></span>
          </div>
          <p class="panel-hint verify-hint" data-i18n="verifyHint"></p>
          <button id="panel-send-files" class="btn primary wide" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
            <span data-i18n="sendFiles"></span>
          </button>
          <button id="panel-cancel" class="btn wide danger" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            <span data-i18n="cancelTransfer"></span>
          </button>
          <button id="panel-send-text" class="btn ghost wide" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg>
            <span data-i18n="sendText"></span>
          </button>
          <div class="panel-pair">
            <span class="paired-tag" id="panel-paired" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
              <span data-i18n="pairedBadge"></span>
            </span>
            <button id="panel-pair" class="link-btn" type="button"></button>
          </div>
          <p class="panel-hint" data-i18n="dropHint"></p>
        </div>

        <div data-view="pick" hidden>
          <p class="panel-kicker">✦</p>
          <h3 data-i18n="pickTitle"></h3>
          <p class="muted" data-i18n="pickBody"></p>
        </div>

        <div data-view="searching">
          <p class="panel-kicker">✦</p>
          <h3 data-i18n="searchTitle"></h3>
          <p class="muted" data-i18n="searchBody"></p>
        </div>

        <div data-view="none" hidden>
          <p class="panel-kicker">?</p>
          <h3 data-i18n="helpTitle"></h3>
          <ol class="help-list">
            <li data-i18n="help1"></li>
            <li data-i18n="help2"></li>
            <li data-i18n="help3"></li>
          </ol>
          <button class="btn wide" type="button" data-use-room>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2M14 9l2 2"/></svg>
            <span data-i18n="useRoom"></span>
          </button>
        </div>

        <div data-view="error" hidden>
          <p class="panel-kicker">!</p>
          <h3 data-i18n="heroError"></h3>
          <p class="muted" id="panel-error-text"></p>
          <button class="btn wide" type="button" data-use-room>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2M14 9l2 2"/></svg>
            <span data-i18n="useRoom"></span>
          </button>
        </div>
      </aside>
    </div>

    <section class="scan" id="scan" role="status">
      <span class="scan-icon" id="scan-icon" aria-hidden="true"></span>
      <div class="scan-text">
        <b id="scan-title"></b>
        <span id="scan-detail"></span>
      </div>
      <div class="scan-track" aria-hidden="true"><span></span></div>
      <span class="scan-count" id="scan-count"></span>
      <button id="scan-room" class="btn small" type="button" data-use-room hidden><span data-i18n="useRoom"></span></button>
    </section>
  </main>

  <footer class="me">
    <div class="me-card">
      <small data-i18n="youAre"></small>
      <button id="me-name" class="name-btn" type="button" data-i18n-title="rename"></button>
    </div>
    <p class="about" data-i18n="about"></p>
  </footer>

  <div id="pending-bar" class="pending-bar" hidden>
    <span id="pending-text"></span>
    <button id="pending-cancel" type="button" class="btn ghost small" data-i18n="cancelPending"></button>
  </div>

  <div id="drop-overlay" class="drop-overlay" hidden><span data-i18n="dropHere"></span></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="sr-live" class="visually-hidden" aria-live="polite"></div>
  <input id="file-input" type="file" multiple hidden>

  <!-- Room / QR -->
  <dialog id="dlg-room">
    <form method="dialog" class="sheet">
      <h3 data-i18n="roomTitle"></h3>
      <div id="room-active" hidden>
        <p class="muted" data-i18n="yourRoom"></p>
        <div class="code" id="room-code"></div>
        <p class="muted small code-alt" id="room-code-alt"></p>
        <p class="small code-say" data-i18n="codeSay"></p>
        <div class="qr" id="room-qr"></div>
        <p class="muted small" data-i18n="scanHint"></p>
        <div class="row">
          <button type="button" class="btn" id="room-copy" data-i18n="copyLink"></button>
          <button type="button" class="btn ghost" id="room-leave" data-i18n="leaveRoom"></button>
        </div>
      </div>
      <div id="room-idle">
        <p class="muted" data-i18n="roomHelp"></p>
        <button type="button" class="btn primary wide" id="room-create" data-i18n="createRoom"></button>
        <div class="join">
          <input id="room-input" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" enterkeyhint="go" data-i18n-placeholder="codePlaceholder">
          <button type="button" class="btn" id="room-join" data-i18n="joinRoom"></button>
        </div>
        <p class="field-error" id="room-error" role="alert" hidden></p>
        <button type="button" class="btn wide" id="room-scan" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 12h8"/></svg>
          <span data-i18n="scanQr"></span>
        </button>
      </div>
      <div class="pairs">
        <h4 data-i18n="pairsTitle"></h4>
        <ul class="pair-list" id="pair-list"></ul>
        <p class="muted small" id="pairs-empty" data-i18n="pairsEmpty"></p>
      </div>
      <div class="row end"><button class="btn ghost" value="close" data-i18n="close"></button></div>
    </form>
  </dialog>

  <!-- QR scanner -->
  <dialog id="dlg-scan">
    <form method="dialog" class="sheet">
      <h3 data-i18n="scanTitle"></h3>
      <div class="scan-view">
        <video id="scan-video" playsinline muted></video>
        <span class="scan-frame" aria-hidden="true"></span>
      </div>
      <p class="muted small" id="scan-status" role="status"></p>
      <div class="row end"><button class="btn ghost" value="cancel" data-i18n="cancel"></button></div>
    </form>
  </dialog>

  <!-- Pairing request -->
  <dialog id="dlg-pair">
    <form method="dialog" class="sheet">
      <h3 id="pair-title"></h3>
      <p class="muted" data-i18n="pairBody"></p>
      <p class="small" data-i18n="pairCheck"></p>
      <div class="verify big">
        <span class="verify-label" data-i18n="verifyLabel"></span>
        <span class="verify-code" id="pair-code"></span>
      </div>
      <div class="row end">
        <button class="btn ghost" value="no" data-i18n="decline"></button>
        <button class="btn primary" value="yes" data-i18n="pairAccept"></button>
      </div>
    </form>
  </dialog>

  <!-- Incoming offer -->
  <dialog id="dlg-offer">
    <form method="dialog" class="sheet">
      <h3 id="offer-title"></h3>
      <p class="muted" id="offer-summary"></p>
      <div class="verify" id="offer-verify" hidden>
        <span class="verify-label" data-i18n="verifyLabel"></span>
        <span class="verify-code" id="offer-code"></span>
      </div>
      <ul class="file-list" id="offer-files"></ul>
      <div class="row end">
        <button class="btn ghost" value="no" data-i18n="decline"></button>
        <button class="btn primary" value="yes" data-i18n="accept"></button>
      </div>
    </form>
  </dialog>

  <!-- Received files -->
  <dialog id="dlg-received">
    <form method="dialog" class="sheet">
      <h3 id="received-title"></h3>
      <ul class="file-list" id="received-files"></ul>
      <div class="row end">
        <button class="btn ghost" value="close" data-i18n="close"></button>
        <button type="button" class="btn primary" id="received-all" data-i18n="saveAll"></button>
      </div>
    </form>
  </dialog>

  <!-- Compose text -->
  <dialog id="dlg-compose">
    <form method="dialog" class="sheet">
      <h3 id="compose-title"></h3>
      <textarea id="compose-text" rows="5" data-i18n-placeholder="textPlaceholder"></textarea>
      <div class="row end">
        <button class="btn ghost" value="cancel" data-i18n="cancel"></button>
        <button class="btn primary" value="send" id="compose-send" data-i18n="send"></button>
      </div>
    </form>
  </dialog>

  <!-- Incoming text -->
  <dialog id="dlg-message">
    <form method="dialog" class="sheet">
      <h3 id="message-title"></h3>
      <div class="message" id="message-body"></div>
      <div class="row end">
        <button class="btn ghost" value="close" data-i18n="close"></button>
        <a class="btn" id="message-open" target="_blank" rel="noopener noreferrer" hidden data-i18n="open"></a>
        <button type="button" class="btn primary" id="message-copy" data-i18n="copy"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
